<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>直播精華二傳工具｜Futu Live Digest Writer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <header class="topbar">
    <div class="topbar-glow"></div>
    <div class="brand">
      <span class="logo">🎙️</span>
      <div>
        <h1>直播精華二傳工具</h1>
        <p>字幕 → 標題 · 金句 · 深度精華 · 合規審核</p>
      </div>
    </div>
    <div class="topbar-actions">
      <button id="btnExport" class="btn" title="把四部曲成果匯出為 Markdown 檔案">⬇ 匯出</button>
      <button id="btnClearAll" class="btn btn-ghost" title="清空所有輸入與生成結果">清空</button>
      <button id="btnSettings" class="btn btn-primary" title="設定模型供應商與 API 密鑰">⚙ 設定</button>
    </div>
  </header>

  <main class="layout">

    <!-- 左：輸入 -->
    <section class="pane" id="paneInput">
      <div class="pane-glow"></div>
      <h2 class="pane-title"><span class="pane-idx">01</span>輸入</h2>
      <div class="pane-body">
        <div class="field">
          <label for="metaTitle">直播標題</label>
          <input id="metaTitle" type="text" placeholder="例如：交易方法與條件單｜牛牛功能營直播" />
        </div>
        <div class="field">
          <label for="metaGuest">嘉賓／身份</label>
          <input id="metaGuest" type="text" placeholder="例如：RON LAU（全職炒家）" />
        </div>
        <div class="field">
          <label for="metaSource">來源連結</label>
          <input id="metaSource" type="text" placeholder="直播回放或帖文連結（選填）" />
        </div>
        <div class="field">
          <label for="styleSelect">風格預設</label>
          <select id="styleSelect">
            <option value="futu">富途社區（深度精華）</option>
            <option value="bullfriend">牛友故事（短小精悍·實盤向）</option>
          </select>
        </div>
        <div class="field grow">
          <label for="transcript">
            <span>字幕／筆記全文</span>
            <span id="charCount" class="muted">0 字</span>
          </label>
          <textarea id="transcript" spellcheck="false"
            placeholder="貼入直播字幕或逐字稿…&#10;&#10;格式不限，建議保留「嘉賓：」「主持人：」等發言人標記，金句提取會更準確。"></textarea>
        </div>
        <div class="btn-row">
          <button id="btnSample" class="btn btn-ghost">載入示例</button>
          <button id="btnClearInput" class="btn btn-ghost">清空輸入</button>
        </div>
        <button id="btnGenerate" class="btn btn-primary btn-block">⚡ 一鍵生成四部曲</button>
        <button id="btnStop" class="btn btn-danger btn-block hidden">■ 停止生成</button>
        <div class="log" id="log"></div>
      </div>
    </section>

    <!-- 中：輸出 -->
    <section class="pane" id="paneOutput">
      <div class="pane-glow"></div>
      <div class="output-head">
        <h2 class="pane-title"><span class="pane-idx">02</span>輸出</h2>
        <div class="stage-tabs" id="stageTabs">
          <button class="stage-tab active" data-key="titles"><i class="dot"></i>標題備選</button>
          <button class="stage-tab" data-key="quotes"><i class="dot"></i>嘉賓金句</button>
          <button class="stage-tab" data-key="article"><i class="dot"></i>直播精華</button>
          <button class="stage-tab" data-key="review"><i class="dot"></i>內容審核</button>
        </div>
      </div>
      <textarea id="outputArea" class="grow" spellcheck="false"
        placeholder="尚未生成。貼入字幕後點「⚡ 一鍵生成四部曲」，或在右下角與 AI 對答優化。&#10;&#10;生成結果可直接在此編輯。"></textarea>
      <div class="output-foot">
        <span id="outStatus" class="muted"></span>
        <div class="btn-row">
          <button id="btnRerun" class="btn btn-ghost">↻ 重跑此步</button>
          <button id="btnCopy" class="btn btn-ghost">複製</button>
        </div>
      </div>
    </section>

    <!-- 右：AI 對答 -->
    <section class="pane" id="paneChat">
      <div class="pane-glow"></div>
      <h2 class="pane-title"><span class="pane-idx">03</span>AI 對答<span class="muted"> 帶字幕與初稿上下文</span></h2>
      <div class="chat-log" id="chatLog">
        <div class="chat-empty">
          <div class="chat-empty-icon">💬</div>
          AI 已帶着你的字幕與初稿，可直接下指令<br />
          <span class="chat-empty-hint">例如：「把第三段例子改具體」「幫我改掉收益暗示」</span>
        </div>
      </div>
      <div class="chips" id="chips">
        <button class="chip" data-action="punchier-titles">標題更犀利</button>
        <button class="chip" data-action="sharper-quotes">金句更精煉</button>
        <button class="chip" data-action="compress">正文壓縮三成</button>
        <button class="chip" data-action="new-opener">換個開頭</button>
        <button class="chip" data-action="recheck">合規再檢查</button>
      </div>
      <div class="chat-input-row">
        <input id="chatInput" type="text" placeholder="對 AI 說你的修改要求… Ctrl+Enter 發送" />
        <button id="btnChatSend" class="btn btn-primary">發送</button>
      </div>
    </section>

  </main>

  <!-- 設定對話框 -->
  <dialog id="settingsModal">
    <form method="dialog" class="modal-card">
      <div class="modal-glow"></div>
      <h2>⚙ 模型設定</h2>
      <p class="muted">密鑰只保存在本機瀏覽器，經本地伺服器直連供應商，不經任何第三方。</p>
      <div class="field">
        <label for="provider">供應商預設</label>
        <select id="provider">
          <option value="deepseek">DeepSeek（api.deepseek.com）</option>
          <option value="openai">OpenAI（api.openai.com）</option>
          <option value="moonshot">Moonshot Kimi（api.moonshot.cn）</option>
          <option value="qwen">阿里通義（dashscope.aliyuncs.com）</option>
          <option value="zhipu">智譜 GLM（open.bigmodel.cn）</option>
          <option value="custom">自訂</option>
        </select>
      </div>
      <div class="field">
        <label for="baseUrl">Base URL</label>
        <input id="baseUrl" type="text" placeholder="https://api.example.com/v1" />
      </div>
      <div class="field">
        <label for="apiKey">API Key</label>
        <input id="apiKey" type="password" placeholder="sk-…" autocomplete="off" />
      </div>
      <div class="field">
        <label for="model">模型</label>
        <input id="model" type="text" placeholder="deepseek-chat" />
      </div>
      <div class="field">
        <label for="temperature">溫度：<b id="tempVal">0.7</b></label>
        <input id="temperature" type="range" min="0" max="1.5" step="0.1" value="0.7" />
      </div>
      <div class="modal-actions">
        <button type="button" id="btnTest" class="btn btn-ghost">測試連線</button>
        <span id="testResult" class="muted"></span>
        <span class="spacer"></span>
        <button value="cancel" class="btn btn-ghost">取消</button>
        <button type="button" id="btnSaveSettings" class="btn btn-primary">保存並關閉</button>
      </div>
    </form>
  </dialog>

  <div id="toast" class="toast hidden"></div>

  <script src="app.js"></script>
</body>
</html>
